name: Maoyan Presale Tracker

# schedule v2
on:
  workflow_dispatch:
  schedule:
    # 每小时整点（北京时间 UTC+8）
    - cron: '30 * * * *'


permissions:
  contents: write

concurrency:                # 👈 防止外部触发与兜底schedule撞车
  group: maoyan-presale-tracker
  cancel-in-progress: true


jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch script
        run: python3 scripts/maoyan_presale.py

      - name: Commit data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "maoyan-bot"
          git config user.email "maoyan-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/vshg245/maoyan-presale.git"
          git add maoyan_presale.csv
          git diff --cached --quiet || git commit -m "chore: update presale data $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
